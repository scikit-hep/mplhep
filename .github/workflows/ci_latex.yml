# GitHub Actions workflow for testing LaTeX-dependent styles
#
# This workflow tests matplotlib styles that require LaTeX to be installed:
# - CMSTex, ROOTTex (CMS experiment)
# - DUNETex, DUNETex1 (DUNE experiment)
# - ATLASTex (ATLAS experiment)
# - LHCbTex1, LHCbTex2 (LHCb experiment)
#
# These tests are separated from the main CI workflow because:
# 1. LaTeX installation adds ~500MB and several minutes to CI time
# 2. LaTeX rendering can be environment-dependent
# 3. Most PRs don't affect LaTeX-dependent features
#
# The workflow runs:
# - On pull requests that modify style files or LaTeX tests
# - Weekly (every Monday) to catch regressions
# - Manually via workflow_dispatch

name: CI LaTeX

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Not just styles/: these tests call mh.cms.label, mh.dune.label,
      # mh.atlas.label and mh.lhcb.label, which live in label.py and exp_*.py.
      - 'src/mplhep/**'
      - 'tests/**'
      - '.github/workflows/ci_latex.yml'
  # Run weekly on Monday at 0:00 UTC
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-latex:
    name: "LaTeX Tests • Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          activate-environment: true
          version: 'latest'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install core fonts
        run: |
          set -euo pipefail
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -y
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -fv
          if ! fc-list | grep -qi "times new roman"; then
            echo "ERROR: Times New Roman font not found after installation." >&2
            exit 1
          fi
          echo "Times New Roman font verified successfully."

      - name: Install LaTeX packages
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science tex-gyre dvipng cm-super

      - name: Install package
        run: |
          uv pip install -e '.[all]'
          uv pip install pytest-github-actions-annotate-failures
          uv pip install pytest-xdist
          uv pip list

      - name: Verify LaTeX installation
        run: |
          which latex
          latex --version

      # Selecting by marker rather than by filename picks up any latex-marked
      # test wherever it lives. MPLHEP_REQUIRE_LATEX turns conftest's "LaTeX not
      # installed" skip into an error, so a broken texlive install cannot pass
      # this job by silently skipping every test.
      - name: Test LaTeX styles with pytest
        env:
          MPLHEP_REQUIRE_LATEX: '1'
        run: |
          python -m pytest -m latex -r sa --mpl --mpl-results-path=pytest_results_latex -n 4 --benchmark-disable

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pytest_results_latex-${{ matrix.python-version }}
          retention-days: 7
          path: pytest_results_latex
